# Jason Stys: strict Python tooling and all-runtime-module branch/statement coverage.
[project]
name = "network-defense-analysis-lab"
version = "1.0.0"
description = "Offline synthetic packet and log evidence analysis by Jason Stys"
requires-python = ">=3.12"
dependencies = []
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
strict = true
python_version = "3.12"
files = ["ndal"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["ndal"]
[tool.coverage.report]
fail_under = 95
show_missing = true
